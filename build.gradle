plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

fabricApi {
	// Client game tests drive a real client (world load, screenshots, frame timing) against the Metal backend.
	configureTests {
		createSourceSet = true
		modId = "ingot-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is only needed by the client game tests, never at runtime.
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// ---------------------------------------------------------------------------
// Native bridge: native/src/*.m -> universal libingot.dylib, bundled at natives/macos/
// ---------------------------------------------------------------------------

def nativeSrcDir = layout.projectDirectory.dir("native")
def nativeOutDir = layout.buildDirectory.dir("native")
def isMac = System.getProperty("os.name").toLowerCase().contains("mac")

tasks.register("compileNative", Exec) {
	description = "Builds the Objective-C Metal bridge (libingot.dylib)"
	group = "build"
	onlyIf { isMac }

	inputs.dir(nativeSrcDir)
	outputs.dir(nativeOutDir)

	def sources = fileTree(nativeSrcDir.dir("src")) { include "**/*.m" }.files.sort()
	def outFile = nativeOutDir.get().file("natives/macos/libingot.dylib").asFile

	doFirst { outFile.parentFile.mkdirs() }

	executable "xcrun"
	args(["-sdk", "macosx", "clang",
		"-arch", "arm64", "-arch", "x86_64",
		"-mmacosx-version-min=12.0",
		"-dynamiclib", "-install_name", "@rpath/libingot.dylib",
		"-fobjc-arc", "-fvisibility=hidden",
		"-O2", "-g",
		"-Wall", "-Wextra", "-Wno-unused-parameter", "-Werror=implicit-function-declaration",
		"-I", nativeSrcDir.dir("include").asFile.absolutePath,
		"-framework", "Foundation", "-framework", "Metal", "-framework", "QuartzCore",
		"-o", outFile.absolutePath] + sources.collect { it.absolutePath })
}

processResources {
	dependsOn "compileNative"
	from(nativeOutDir) {
		include "natives/**"
	}

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	runs {
		configureEach {
			// FFM downcalls into libingot need native access; the vanilla launcher passes the same flag.
			vmArg "--enable-native-access=ALL-UNNAMED"
		}
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// ---- Benchmark harness ----
// src/bench is a separate mod ("ingot-bench", fabricloader + minecraft only) that loads a prepared world, drives a
// scripted camera path and writes frame-time statistics. It is only on the classpath of the "bench" run
// (./gradlew runBench) and never ends up in the ingot jar. bench/run.sh drives everything; see bench/README.md.
//   -Pbench.runDir=run/bench/<config>   game directory for the run (relative to the project)
//   -Pbench.sysprops=<file>             .properties file; every entry becomes -D<key>=<value> (ingot.*, ingot.bench.*)
//   -Pbench.width=1280 -Pbench.height=720   logical window size (the Retina framebuffer is 2x)
//   -Pbench.withIngot=false             leave the ingot mod off the classpath entirely (only for when src/main does not
//                                       build; the vanilla/mainstream configs normally run with Ingot present but disabled)
def benchProp = { String key, String fallback -> (project.findProperty("bench.${key}") ?: fallback).toString() }

sourceSets {
	bench {
		// The harness never references Ingot classes, so it compiles on its own; Ingot is only added at runtime.
		if (benchProp("withIngot", "true").toBoolean()) {
			runtimeClasspath += sourceSets.main.output
		}
	}
}

configurations {
	benchCompileClasspath.extendsFrom compileClasspath
	benchRuntimeClasspath.extendsFrom runtimeClasspath
}

loom {
	mods {
		"ingot-bench" {
			sourceSet sourceSets.bench
		}
	}

	runs {
		bench {
			client()
			configName = "Ingot Benchmark"
			ideConfigGenerated false
			source sourceSets.bench
			runDir benchProp("runDir", "run/bench/manual")
			programArgs "--width", benchProp("width", "1280"), "--height", benchProp("height", "720"),
				"--username", "IngotBench", "--uuid", "1b3e5a7c-0000-4000-8000-000000be0c11"
			// Identical for every configuration: the vanilla launcher's default JVM flags for 26.3 (-Xmx4G, ZGC).
			vmArgs "-Xms2G", "-Xmx4G", "-XX:+UseCompactObjectHeaders", "-XX:+AlwaysPreTouch",
				"-XX:+UseStringDeduplication", "-XX:+UseZGC"
			def sysprops = project.findProperty("bench.sysprops")
			if (sysprops != null) {
				def props = new Properties()
				file(sysprops.toString()).withInputStream { props.load(it) }
				props.stringPropertyNames().sort().each { vmArg "-D${it}=${props.getProperty(it)}" }
			}
		}
	}
}
// ---- end benchmark harness ----
